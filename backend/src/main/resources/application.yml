server:
  port: 8080

spring:
  application:
    name: scheduling
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/scheduling?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:}
  expire-minutes: 720

# 默认管理员密码（仅在首次启动数据库为空时使用）
default:
  admin:
    password: ${DEFAULT_ADMIN_PASSWORD:}

logging:
  level:
    com.example.scheduling: info
