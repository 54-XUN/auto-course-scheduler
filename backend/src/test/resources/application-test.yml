spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: test-jwt-secret-key-minimum-32-characters
  expire-minutes: 60

default:
  admin:
    password: admin123

data:
  initializer:
    enabled: false

logging:
  level:
    root: warn
    com.example.scheduling: info